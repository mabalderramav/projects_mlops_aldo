data:
  path: data/processed/train.parquet
  target: repurchased_60d

model:
  name: xgboost

  fixed_hyperparameters:
    random_state: 42
    n_jobs: 1

  baseline_hyperparameters:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    subsample: 1.0
    colsample_bytree: 1.0
    scale_pos_weight: 1.0
    min_child_weight: 1

  search_space:
    n_estimators:
      type: int
      low: 50
      high: 300

    max_depth:
      type: int
      low: 2
      high: 8

    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true

    subsample:
      type: float
      low: 0.6
      high: 1.0

    colsample_bytree:
      type: float
      low: 0.6
      high: 1.0

    scale_pos_weight:
      type: float
      low: 1.0
      high: 60.0
      log: true

    min_child_weight:
      type: int
      low: 1
      high: 20

validation:
  strategy: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  n_jobs: 1

  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - average_precision

tuning:
  n_trials: 50
  direction: maximize
  objective_metric: average_precision
  random_state: 42
  n_jobs: 1
  include_baseline: true

output:
  best_hyperparameters_path: artifacts/best_hyperparameters.json
  results_path: artifacts/tuning_results.json